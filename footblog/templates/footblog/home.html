
{% extends "footblog/base.html" %}
{% block content %}
    <h1>Home</h1>
    <p>Welcome to the home page of the football blog!</p>
    <hr>
    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <p><strong>By {{ post.author }}</strong></p>
            <p>{{ post.content }}</p>
            <p><em>Posted on {{ post.created_at|date:"F d, Y" }}</em></p>
        </article>
        <hr>
    {% endfor %}
</body>
</html>

{% endblock %}
